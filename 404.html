<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>BARBERSHOP AA'MILL & ACADEMY</title>
    <script>
      // Single Page Apps redirect for GitHub Pages, Vercel, Netlify
      (function() {
        var l = window.location;
        var path = l.pathname;
        
        // Handle repo base path (GitHub Pages) or root domain (Vercel)
        var basePath = '';
        if (path.indexOf('/barbershop-aa-mill') === 0) {
          basePath = '/barbershop-aa-mill';
        } else if (path.indexOf('/barbershopaamill') === 0) {
          basePath = '/barbershopaamill';
        }

        var subRoute = path.substring(basePath.length).replace(/^\/+/, '').replace(/\/+$/, '');
        var targetUrl = l.protocol + '//' + l.host + basePath + '/';
        
        if (subRoute && subRoute !== 'index.html') {
          targetUrl += '#' + subRoute;
        }
        
        if (l.search) {
          targetUrl += (subRoute ? '&' : '?') + l.search.slice(1);
        }
        
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
